<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manifest Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f4f6f9; color: #1a1a2e; }

    header {
      background: #1a1a2e;
      color: white;
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    main { max-width: 1100px; margin: 32px auto; padding: 0 24px; }

    .search-bar {
      background: white;
      border-radius: 8px;
      padding: 20px 24px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      flex-wrap: wrap;
    }

    .search-bar label { font-weight: 500; white-space: nowrap; }

    select, input[type="text"] {
      padding: 8px 12px;
      border: 1px solid #cdd0d8;
      border-radius: 6px;
      font-size: 0.95rem;
      background: white;
      min-width: 180px;
    }

    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: #4f6ef7;
    }

    button {
      padding: 8px 20px;
      background: #4f6ef7;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { background: #3a58d6; }

    .status {
      margin: 16px 0 8px;
      font-size: 0.9rem;
      color: #555;
      min-height: 20px;
    }

    .error { color: #c0392b; }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      font-size: 0.9rem;
    }

    thead { background: #1a1a2e; color: white; }
    th { padding: 12px 14px; text-align: left; font-weight: 500; }
    td { padding: 10px 14px; border-bottom: 1px solid #eef0f4; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f0f3ff; }

    .empty { text-align: center; padding: 40px; color: #888; }

    #input-wrapper { display: flex; align-items: center; }

    #doc-panel {
      margin-top: 24px;
      background: white;
      border-radius: 8px;
      padding: 20px 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      max-width: 520px;
    }

    #doc-panel h3 { margin-bottom: 14px; font-size: 1rem; }

    #doc-table { border-collapse: collapse; width: 100%; margin-bottom: 12px; }
    #doc-table th, #doc-table td { border: 1px solid #eef0f4; padding: 7px 12px; text-align: left; font-size: 0.9rem; }
    #doc-table th { background: #f4f6f9; width: 40%; font-weight: 500; }

    .form-row { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; font-size: 0.9rem; }
    .form-row label { width: 150px; font-weight: 500; flex-shrink: 0; }
    .form-row input { flex: 1; }

    .btn-row { margin-top: 12px; display: flex; gap: 8px; }

    button.secondary { background: #6b7280; }
    button.secondary:hover { background: #4b5563; }
    button.danger { background: #c0392b; }
    button.danger:hover { background: #a93226; }

    #doc-status { margin-top: 8px; font-size: 0.85rem; color: #c0392b; }
  </style>
</head>
<body>

<header>
  Manifest Viewer
  <a href="/" style="color:white; float:right; font-size:0.9rem; margin-left:16px;">Home</a>
  <a href="/passenger" style="color:white; float:right; font-size:0.9rem;">Passenger Search</a>
</header>

<main>

  <div class="search-bar">
    <label for="flight-num">Find flight:</label>
    <input type="text" id="flight-num" placeholder="Flight No. e.g. AB 123" />
    <input type="text" id="flight-date" placeholder="Date e.g. 2026-04-07" />
    <input type="text" id="flight-origin" placeholder="Origin e.g. SFO" />
    <input type="text" id="flight-dest" placeholder="Destination e.g. HND" />
    <button onclick="findFlight()">Search</button>

    <label for="search-type">Search by:</label>
    <select id="search-type" onchange="onSearchTypeChange()">
      <option value="last_name">Last Name</option>
      <option value="ssr_code">SSR Code</option>
      <option value="seat">Seat</option>
    </select>

    <div id="input-wrapper">
      <input type="text" id="text-input" placeholder="Enter last name..." />
      <select id="cabin-select" style="display:none;">
        <option value="Business">Business</option>
        <option value="Economy">Economy</option>
        <option value="Premium Eco">Premium Eco</option>
      </select>
      <select id="ssr-select" style="display:none;"></select>
      <input type="text" id="seat-input" placeholder="Seat e.g. 12A" style="display:none;" />
    </div>

    <button onclick="findPax()">Search</button>
  </div>

  <div class="search-bar">
    <label>Filter by Cabin:</label>
    <select id="cabin-filter" onchange="applyFilters()">
      <option value="">All</option>
      <option value="Business">Business</option>
      <option value="Economy">Economy</option>
      <option value="Premium Eco">Premium Eco</option>
    </select>
  </div>

  <div class="status" id="status"></div>

  <table id="results-table" style="display:none;">
    <thead>
      <tr>
        <th>Seat</th>
        <th>Last Name</th>
        <th>First Name</th>
        <th>Cabin Class</th>
        <th>SSR Codes</th>
        <th>Record Locator</th>
        <th>Travel Doc</th>
      </tr>
    </thead>
    <tbody id="results-body"></tbody>
  </table>

  <div id="doc-panel" style="display:none;">
    <h3>Travel Document — <span id="doc-passenger-name"></span></h3>

    <div id="doc-view">
      <table id="doc-table">
        <tbody>
          <tr><th>Type</th><td id="dv-type"></td></tr>
          <tr><th>Number</th><td id="dv-no"></td></tr>
          <tr><th>Last Name</th><td id="dv-last"></td></tr>
          <tr><th>First Name</th><td id="dv-first"></td></tr>
          <tr><th>Nationality</th><td id="dv-nationality"></td></tr>
          <tr><th>Country of Issue</th><td id="dv-country"></td></tr>
          <tr><th>Date of Birth</th><td id="dv-dob"></td></tr>
          <tr><th>Date of Expiry</th><td id="dv-expiry"></td></tr>
        </tbody>
      </table>
      <div class="btn-row">
        <button type="button" onclick="showEditForm()">Edit</button>
        <button type="button" class="danger" onclick="deleteDoc()">Delete</button>
      </div>
    </div>

    <div id="doc-form" style="display:none;">
      <input type="hidden" id="form-mode" value="add">
      <div class="form-row"><label>Type</label><input type="text" id="form-doc-type" value="PP" readonly></div>
      <div class="form-row"><label>Number</label><input type="text" id="form-doc-no" placeholder="e.g. A12345678"></div>
      <div class="form-row"><label>Last Name</label><input type="text" id="form-last-name"></div>
      <div class="form-row"><label>First Name</label><input type="text" id="form-first-name"></div>
      <div class="form-row"><label>Nationality</label><input type="text" id="form-nationality" placeholder="e.g. USA"></div>
      <div class="form-row"><label>Country of Issue</label><input type="text" id="form-country" placeholder="e.g. USA"></div>
      <div class="form-row"><label>Date of Birth</label><input type="text" id="form-dob" placeholder="YYYY-MM-DD"></div>
      <div class="form-row"><label>Date of Expiry</label><input type="text" id="form-expiry" placeholder="YYYY-MM-DD"></div>
      <div class="btn-row">
        <button type="button" onclick="submitDoc()">Save</button>
        <button type="button" class="secondary" onclick="cancelForm()">Cancel</button>
      </div>
    </div>

    <div id="doc-status"></div>
  </div>
</main>

<script>
  let allPassengers = [];
  let displayedPassengers = [];
  let currentDocIdx = -1;
  let currFlightNum = "";
  let currFlightDate = "";
  // Populate SSR dropdown on page load
  fetch("/ssr_codes")
    .then(r => r.json())
    .then(codes => {
      const sel = document.getElementById("ssr-select");
      codes.forEach(c => {
        const opt = document.createElement("option");
        opt.value = c.code;
        opt.textContent = `${c.code} — ${c.description}`;
        sel.appendChild(opt);
      });
    });
  
  function findFlight() {
    const flightNum = document.getElementById("flight-num").value.trim();
    const flightDate = document.getElementById("flight-date").value.trim();
    const flightOrigin = document.getElementById("flight-origin").value.trim();
    const flightDest = document.getElementById("flight-dest").value.trim();
    const url = `/flights/${encodeURIComponent(flightNum)}`
              + `/${encodeURIComponent(flightDate)}`
              + `/${encodeURIComponent(flightOrigin)}`
              + `/${encodeURIComponent(flightDest)}`
              + `/passengers`
    fetch(url)
    .then(r => r.json())
    .then(data => {
      allPassengers = data;
      renderResults(data);
      currFlightNum = flightNum;
      currFlightDate = flightDate;
    })
    .catch(() => setStatus("Flight not found.", true));
  }

  function onSearchTypeChange() {
    const type = document.getElementById("search-type").value;
    document.getElementById("text-input").style.display = type === "last_name" ? "" : "none";
    document.getElementById("ssr-select").style.display = type === "ssr_code" ? "" : "none";
    document.getElementById("seat-input").style.display = type === "seat" ? "" : "none";
  }

  function applyFilters() {
    if (allPassengers.length === 0) return;
    applyAll();
  }

  function findPax() {
    if (allPassengers.length === 0) {
      setStatus("Load a flight first.", false);
      return;
    }
    applyAll();
  }

  function applyAll() {
    const cabin = document.getElementById("cabin-filter").value;
    const type = document.getElementById("search-type").value;
    let filtered = allPassengers;

    if (cabin) {
      filtered = filtered.filter(p => p.cabin_class === cabin);
    }

    if (type === "last_name") {
      const val = document.getElementById("text-input").value.trim().toUpperCase();
      if (val) filtered = filtered.filter(p => p.last_name && p.last_name.toUpperCase().includes(val));
    } else if (type === "ssr_code") {
      const val = document.getElementById("ssr-select").value;
      if (val) filtered = filtered.filter(p => p.ssr_codes && p.ssr_codes.includes(val));
    } else if (type === "seat") {
      const val = document.getElementById("seat-input").value.trim().toUpperCase();
      if (val) filtered = filtered.filter(p => p.seat && p.seat.toUpperCase() === val);
    }

    renderResults(filtered);
  }

  function renderResults(rows) {
    displayedPassengers = rows;
    const tbody = document.getElementById("results-body");
    const table = document.getElementById("results-table");
    tbody.innerHTML = "";

    if (rows.length === 0) {
      setStatus("No results found.", false);
      table.style.display = "none";
      document.getElementById("doc-panel").style.display = "none";
      return;
    }

    setStatus(`${rows.length} result${rows.length !== 1 ? "s" : ""}`, false);
    rows.forEach((p, i) => {
      const hasDoc = p.document_type && p.document_no;
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${p.seat ?? ""}</td>
        <td>${p.last_name ?? ""}</td>
        <td>${p.first_name ?? ""}</td>
        <td>${p.cabin_class ?? ""}</td>
        <td>${p.ssr_codes ?? ""}</td>
        <td>${p.record_locator ?? ""}</td>
        <td><button type="button" onclick="openDoc(${i})">${hasDoc ? "View Doc" : "Add Doc"}</button></td>
      `;
      tbody.appendChild(tr);
    });
    table.style.display = "table";
  }

  function openDoc(idx) {
    currentDocIdx = idx;
    const p = displayedPassengers[idx];
    document.getElementById("doc-passenger-name").textContent = `${p.first_name} ${p.last_name}`;
    document.getElementById("doc-panel").style.display = "";
    document.getElementById("doc-status").textContent = "";

    if (p.document_type && p.document_no) {
      fetch(`/travel_documents/${p.document_type}/${p.document_no}`)
        .then(r => r.json())
        .then(doc => showDoc(doc));
    } else {
      showAddForm();
    }
  }

  function showDoc(doc) {
    document.getElementById("doc-view").style.display = "";
    document.getElementById("doc-form").style.display = "none";
    document.getElementById("dv-type").textContent = doc.document_type;
    document.getElementById("dv-no").textContent = doc.document_no;
    document.getElementById("dv-last").textContent = doc.last_name;
    document.getElementById("dv-first").textContent = doc.first_name;
    document.getElementById("dv-nationality").textContent = doc.nationality;
    document.getElementById("dv-country").textContent = doc.country_of_issue;
    document.getElementById("dv-dob").textContent = doc.date_of_birth;
    document.getElementById("dv-expiry").textContent = doc.date_of_expiry;
  }

  function showAddForm() {
    const p = displayedPassengers[currentDocIdx];
    document.getElementById("doc-view").style.display = "none";
    document.getElementById("doc-form").style.display = "";
    document.getElementById("form-mode").value = "add";
    document.getElementById("form-doc-type").value = "PP";
    document.getElementById("form-doc-no").value = "";
    document.getElementById("form-last-name").value = p.last_name ?? "";
    document.getElementById("form-first-name").value = p.first_name ?? "";
    document.getElementById("form-nationality").value = "";
    document.getElementById("form-country").value = "";
    document.getElementById("form-dob").value = "";
    document.getElementById("form-expiry").value = "";
  }

  function showEditForm() {
    const p = displayedPassengers[currentDocIdx];
    fetch(`/travel_documents/${p.document_type}/${p.document_no}`)
      .then(r => r.json())
      .then(doc => {
        document.getElementById("doc-view").style.display = "none";
        document.getElementById("doc-form").style.display = "";
        document.getElementById("form-mode").value = "edit";
        document.getElementById("form-doc-type").value = doc.document_type;
        document.getElementById("form-doc-no").value = doc.document_no;
        document.getElementById("form-last-name").value = doc.last_name;
        document.getElementById("form-first-name").value = doc.first_name;
        document.getElementById("form-nationality").value = doc.nationality;
        document.getElementById("form-country").value = doc.country_of_issue;
        document.getElementById("form-dob").value = doc.date_of_birth;
        document.getElementById("form-expiry").value = doc.date_of_expiry;
      });
  }

  function submitDoc() {
    const mode = document.getElementById("form-mode").value;
    const docType = document.getElementById("form-doc-type").value.trim();
    const docNo = document.getElementById("form-doc-no").value.trim();
    const body = {
      document_type: docType,
      document_no: docNo,
      last_name: document.getElementById("form-last-name").value.trim(),
      first_name: document.getElementById("form-first-name").value.trim(),
      nationality: document.getElementById("form-nationality").value.trim(),
      country_of_issue: document.getElementById("form-country").value.trim(),
      date_of_birth: document.getElementById("form-dob").value.trim(),
      date_of_expiry: document.getElementById("form-expiry").value.trim(),
    };

    let req;
    if (mode === "add") {
      req = fetch("/travel_documents", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    } else {
      const p = displayedPassengers[currentDocIdx];
      req = fetch(`/travel_documents/${p.document_type}/${p.document_no}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
    }

    req
      .then(r => r.json())
      .then(resp => {
        if (resp.error) { setDocStatus("Error: " + resp.error); return; }
        displayedPassengers[currentDocIdx].document_type = docType;
        displayedPassengers[currentDocIdx].document_no = docNo;
        // Refresh the row's button label without re-rendering the whole table
        const btn = document.getElementById("results-body")
          .querySelectorAll("tr")[currentDocIdx].querySelector("button");
        btn.textContent = "View Doc";
        openDoc(currentDocIdx);
      })
      .catch(() => setDocStatus("Request failed."));
  }

  function deleteDoc() {
    if (!confirm("Delete this travel document?")) return;
    const p = displayedPassengers[currentDocIdx];
    fetch(`/travel_documents/${p.document_type}/${p.document_no}`, { method: "DELETE" })
      .then(r => r.json())
      .then(resp => {
        if (resp.error) { setDocStatus("Error: " + resp.error); return; }
        displayedPassengers[currentDocIdx].document_type = null;
        displayedPassengers[currentDocIdx].document_no = null;
        const btn = document.getElementById("results-body")
          .querySelectorAll("tr")[currentDocIdx].querySelector("button");
        btn.textContent = "Add Doc";
        showAddForm();
      })
      .catch(() => setDocStatus("Request failed."));
  }

  function cancelForm() {
    const p = displayedPassengers[currentDocIdx];
    if (p.document_type && p.document_no) {
      openDoc(currentDocIdx);
    } else {
      document.getElementById("doc-panel").style.display = "none";
    }
  }

  function setDocStatus(msg) {
    document.getElementById("doc-status").textContent = msg;
  }

  function setStatus(msg, isError) {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = isError ? "status error" : "status";
  }

  // Allow Enter key to trigger search
  document.getElementById("text-input").addEventListener("keydown", e => {
    if (e.key === "Enter") findPax();
  });
</script>

</body>
</html>
